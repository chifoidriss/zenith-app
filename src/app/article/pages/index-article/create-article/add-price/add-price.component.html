<h2 mat-dialog-title>
  {{ data?.id ? 'Modifier':'Ajouter' }} un prix

  <button mat-dialog-close class="btn-close"></button>
</h2>
<mat-divider></mat-divider>

<mat-dialog-content class="mat-typography-">
  <form [formGroup]="form">
    <div class="row gy-4 gx-3">
      <div class="col-md-8 col-12">
        <div class="form-group">
          <label class="form-label">Unité de mesure</label>
          <select class="form-control" formControlName="unit_id">
            <option *ngFor="let item of units" [value]="item.id">
              {{ item.name }}
            </option>
          </select>
        </div>
      </div>
      <div class="col-md-4 col-12">
        <div class="form-group">
          <label class="form-label">Calculer</label>
          <select class="form-control" formControlName="calcul">
            <option value="D">En jours</option>
            <option value="H">En heures</option>
          </select>
        </div>
      </div>
      <div class="col-md-6 col-12">
        <mdb-form-control>
          <input mdbInput type="number" class="form-control" id="price" formControlName="price" placeholder="Prix normal">
          <label mdbLabel class="form-label" for="price">Prix normal</label>
        </mdb-form-control>
      </div>
      <div class="col-md-6 col-12">
        <mdb-form-control>
          <input mdbInput type="number" class="form-control" id="min_price" formControlName="min_price" placeholder="Prix minimum">
          <label mdbLabel class="form-label" for="min_price">Prix minimum</label>
        </mdb-form-control>
      </div>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-raised-button color="primary" (click)="store()" [disabled]="form.invalid">Enregistrer</button>
  <button mat-stroked-button mat-dialog-close color="warn" cdkFocusInitial>Annuler</button>
</mat-dialog-actions>
