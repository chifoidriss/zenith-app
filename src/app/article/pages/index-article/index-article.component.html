<app-master title="Produits">
  <div header class="d-flex justify-content-between">
    <div class="d-flex">
      <a class="btn btn-sm btn-primary" *ngIf="auth.can(['ARTICLE_W'])" routerLink="/articles/new-article">Ajouter</a>
      <div class="dropdown ms-2">
        <button class="btn btn-sm btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
          Type ({{ showType(type) }})
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" (click)="loadArticles('all')">Tout</a></li>
          <li><a class="dropdown-item" (click)="loadArticles('CONSUMABLE')">Consommables</a></li>
          <li><a class="dropdown-item" (click)="loadArticles('STOCKABLE')">Stockables</a></li>
          <li><a class="dropdown-item" (click)="loadArticles('ROOM')">Chambres</a></li>
          <li><a class="dropdown-item" (click)="loadArticles('SERVICE')">Services</a></li>
          <li><a class="dropdown-item" (click)="loadArticles('MENU')">Menus</a></li>
        </ul>
      </div>
    </div>
    <div class="">
      <input type="search" class="form-control form-control-sm" placeholder="Rechercher...">
    </div>
  </div>

  <app-loader *ngIf="loading"></app-loader>

  <div class="" *ngIf="!loading">
    <div class="table-responsive">
      <table class="table fixed-first-column table-sm table-striped border mb-0">
        <thead class="table-primary">
          <tr>
            <th width="5px">#</th>
            <th width="10px">Référence</th>
            <th width="100px">Type</th>
            <th width="100px">Catégorie</th>
            <th>Nom</th>
            <!-- <th>Prix de vente</th> -->
            <!-- <th>Prix d'achat</th> -->
            <!-- <th>En stock</th> -->
            <th *ngIf="auth.can(['ARTICLE_W'])"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of data?.data; index as i">
            <th>{{ data.from + i }}</th>
            <td>
              <b class="fw-bold pointer" (click)="alert.detailArticle(item.id)">
                {{ item.reference }}
              </b>
            </td>
            <td>{{ item.type_name }}</td>
            <td>
              <span class="text-nowrap">{{ item.category?.full_name }}</span>
            </td>
            <td>{{ item.name }}</td>
            <!-- <td>{{ item.price | price }}</td> -->
            <!-- <td>{{ item.cost | price }}</td> -->
            <!-- <td>{{ 10 }}</td> -->
            <td *ngIf="auth.can(['ARTICLE_W'])" class="text-end">
              <button class="btn btn-sm py-1 px-2 text-nowrap btn-light text-primary" [routerLink]="'/articles/edit-article/'+item.id">
                <i class="mdi mdi-pencil" style="font-size: 14px; line-height: 14px;"></i>
              </button>
              <button class="btn btn-sm py-1 px-2 text-nowrap btn-light text-danger ms-2" (click)="removeItem(i, item)">
                <i class="mdi mdi-trash-can-outline" style="font-size: 14px; line-height: 14px;"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <app-pagination [data]="data" (onPageEvent)="data = $event"></app-pagination>
  </div>
</app-master>
