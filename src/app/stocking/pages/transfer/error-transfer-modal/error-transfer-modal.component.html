<h2 mat-dialog-title>
  Transfert non validé

  <button mat-dialog-close class="btn-close"></button>
</h2>
<mat-divider></mat-divider>

<mat-dialog-content class="mat-typography-">
  <div class="row g-3">
    <div class="col-12" *ngFor="let item of data?.errors">
      <div class="card card-body py-2 border border-danger">
        <span class="text-danger">Quantité non disponible</span>
        <div class="">
          <h6 class="m-0">{{ item.article?.name }}</h6>
          <span>En stock: {{ item?.label }}</span>
        </div>
      </div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-stroked-button mat-dialog-close color="warn" cdkFocusInitial>Fermer</button>
</mat-dialog-actions>
