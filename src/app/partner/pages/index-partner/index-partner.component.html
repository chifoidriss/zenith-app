<app-master [title]="title">
  <div header class="d-flex justify-content-between">
    <div class="">
      <a class="btn btn-sm btn-primary" *ngIf="canWrite()" [routerLink]="'/partners/'+type+'/new'">
        <i class="mdi mdi-account-plus-outline" style="font-size: 14px; line-height: 14px;"></i>
        Ajouter
      </a>
      <button class="btn btn-sm btn-warning text-nowrap ms-2" [disabled]="data.data.length == 0" (click)="export()">
        <i class="mdi mdi-table-arrow-right" style="font-size: 14px; line-height: 14px;"></i>
        Exporter
      </button>
    </div>
    <div class="">
      <input type="search" class="form-control form-control-sm" placeholder="Rechercher...">
    </div>
  </div>

  <app-loader *ngIf="loading"></app-loader>

  <div class="" *ngIf="!loading">
    <div class="table-responsive">
      <table class="table fixed-first-column table-sm table-striped border mb-0">
        <thead class="table-primary">
          <tr>
            <th width="5px">#</th>
            <th width="10px">Référence</th>
            <th>Nom</th>
            <th>Téléphone</th>
            <th>Email</th>
            <th>Adresse</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of data?.data; index as i">
            <th>{{ data.from + i }}</th>
            <td>
              <a (click)="detailPartner(item.id, i)" class="pointer fw-bold">
                {{ item.reference }}
              </a>
            </td>
            <td>{{ item.full_name }}</td>
            <td>{{ item.phone }}</td>
            <td>{{ item.email }}</td>
            <td>{{ item.address_name }}</td>
            <td class="text-end">
              <button class="btn btn-sm py-1 px-2 text-nowrap btn-light text-primary" [routerLink]="'/partners/'+type+'/edit/'+item.id">
                <i class="mdi mdi-pencil" style="font-size: 14px; line-height: 14px;"></i>
              </button>
              <button class="btn btn-sm py-1 px-2 text-nowrap btn-light text-danger ms-2" (click)="removeItem(i, item)">
                <i class="mdi mdi-trash-can-outline" style="font-size: 14px; line-height: 14px;"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <app-pagination [data]="data" (onPageEvent)="data = $event"></app-pagination>
  </div>
</app-master>
