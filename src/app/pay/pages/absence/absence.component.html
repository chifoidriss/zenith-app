<app-master title="Absences">
  <div header class="d-flex justify-content-between">
    <div class="">
      <a class="btn btn-sm btn-primary" (click)="addItem()">Ajouter</a>
    </div>
    <div class="">
      <input type="search" class="form-control form-control-sm" placeholder="Rechercher...">
    </div>
  </div>

  <app-loader *ngIf="loading"></app-loader>

  <div class="" *ngIf="!loading">
    <div class="table-responsive">
      <table class="table fixed-first-column table-sm table-striped border mb-0">
        <thead class="table-primary">
          <tr>
            <th width="5px">#</th>
            <th>Employé</th>
            <th>Motif</th>
            <th>Date départ</th>
            <th>Date retour</th>
            <th>État</th>
            <th>Sanction</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of data?.data; index as i">
            <th>{{ data.from + i }}</th>
            <td>{{ item.partner?.full_name }}</td>
            <td>{{ item.reason }}</td>
            <td>{{ item.start_date | date:'dd/MM/YYYY' }}</td>
            <td>{{ item.end_date | date:'dd/MM/YYYY' }}</td>
            <td>{{ item.justified ? 'Justifiée' : 'Non justifiée' }}</td>
            <td>
              <span *ngIf="!item.justified">{{ item.amount | price }}</span>
              <span *ngIf="item.justified">Aucune</span>
            </td>
            <td class="text-end">
              <button class="btn btn-sm py-1 px-2 text-nowrap btn-light text-primary" (click)="editItem(i, item)">
                <i class="mdi mdi-pencil" style="font-size: 14px; line-height: 14px;"></i>
              </button>
              <button class="btn btn-sm py-1 px-2 text-nowrap btn-light text-danger ms-2" (click)="removeItem(i, item)">
                <i class="mdi mdi-trash-can-outline" style="font-size: 14px; line-height: 14px;"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <app-pagination [data]="data" (onPageEvent)="data = $event"></app-pagination>
  </div>
</app-master>
