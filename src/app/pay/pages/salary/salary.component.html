<app-master title="Salaires">
  <div header class="d-flex justify-content-between">
    <div class="row g-1">
      <div class="col">
        <input type="month" [(ngModel)]="current_month" [max]="next_month" class="form-control form-control-sm">
      </div>
      <div class="col-auto">
        <a class="btn btn-sm btn-primary" (click)="ngOnInit()">Afficher</a>
      </div>
    </div>
    <div class="">
      <input type="search" class="form-control form-control-sm" placeholder="Rechercher...">
    </div>
  </div>

  <app-loader *ngIf="loading"></app-loader>

  <div class="" *ngIf="!loading">
    <div class="table-responsive">
      <table class="table fixed-first-column table-sm table-striped border mb-0">
        <thead class="table-primary">
          <tr>
            <th width="5px">#</th>
            <th>Référence</th>
            <th>Employé</th>
            <th>Contrat</th>
            <th>Poste</th>
            <th>Salaire de base</th>
            <th>Salaire de net</th>
            <th>Paiement</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of data?.data; index as i">
            <th>{{ data.from + i }}</th>
            <td>{{ item.pay?.reference }}</td>
            <td>{{ item.partner?.full_name }}</td>
            <td>{{ item.contract_type?.name }}</td>
            <td>{{ item.post?.name }}</td>
            <td>{{ item.salary | price }}</td>
            <td>{{ item.pay?.invoice?.total | price }}</td>
            <td>
              <button class="btn btn-sm py-1 px-2 text-nowrap btn-success" *ngIf="item.pay?.invoice && item.pay?.invoice?.due_amount == 0">
                <i class="mdi mdi-credit-card-check" style="font-size: 14px; line-height: 14px;"></i>
                Soldée
              </button>
              <button class="btn btn-sm py-1 px-2 text-nowrap btn-warning ms-2-" (click)="addPayment(item, i)" *ngIf="item.pay?.invoice?.status && item.pay?.invoice?.due_amount > 0">
                <i class="mdi mdi-credit-card-plus-outline me-1-" style="font-size: 14px; line-height: 14px;"></i>
                Payer
              </button>
            </td>
            <td class="text-end">
              <button class="btn btn-sm py-1 px-2 text-nowrap btn-primary" *ngIf="!item.pay" #onLoad (click)="create(i, item, onLoad)">
                <span class="spinner-border d-none me-1" style="width: 14px; height: 14px;"></span>
                <i class="mdi mdi-invoice-plus-outline" style="font-size: 14px; line-height: 14px;"></i>
                Créer le bulletin
              </button>
              <!-- <button class="btn btn-sm py-1 px-2 text-nowrap btn-outline-primary" *ngIf="item.pay" (click)="edit(i, item)">
                <i class="mdi mdi-invoice-edit-outline" style="font-size: 14px; line-height: 14px;"></i>
                Modifier
              </button> -->
              <button class="btn btn-sm py-1 px-2 text-nowrap btn-outline-primary ms-2" *ngIf="item.pay" (click)="detail(item.pay)">
                <i class="mdi mdi-invoice-outline" style="font-size: 14px; line-height: 14px;"></i>
                Bulletin
              </button>
              <!-- <button class="btn btn-sm py-1 px-2 text-nowrap btn-light text-primary" (click)="editItem(i, item)">
                <i class="mdi mdi-pencil" style="font-size: 14px; line-height: 14px;"></i>
              </button>
              <button class="btn btn-sm py-1 px-2 text-nowrap btn-light text-danger ms-2" (click)="removeItem(i, item)">
                <i class="mdi mdi-trash-can-outline" style="font-size: 14px; line-height: 14px;"></i>
              </button> -->
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <app-pagination [data]="data" (onPageEvent)="data = $event"></app-pagination>
  </div>
</app-master>
