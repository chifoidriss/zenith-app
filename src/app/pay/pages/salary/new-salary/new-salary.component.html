<h2 mat-dialog-title>
  {{ data?.pay ? 'Modifier':'Ajouter' }} un bulletin de paie

  <button mat-dialog-close class="btn-close"></button>
</h2>
<mat-divider></mat-divider>

<mat-dialog-content class="mat-typography-">

  <app-loader *ngIf="loading"></app-loader>

  <div class="" *ngIf="!loading">
    <!-- <form [formGroup]="form">
    </form> -->

    <div class="row">
      <div class="col-md-6 col-12">
        Employé: <b>{{ data.partner.full_name }}</b> <br>
        Salaire: <b>{{ data.partner.full_name }}</b> <br>
      </div>
      <div class="col-md-6 col-12"></div>
    </div>

    <div class="table-responsive">
      <table class="table table-sm- border mb-0">
        <thead class="table-primary">
          <tr>
            <th>Primes</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of bonuses; index as i">
            <th>{{ item.name }}</th>
            <td class="text-end">
              <input type="number" class="form-control form-control-sm" placeholder="Valeur...">
            </td>
          </tr>
        </tbody>

        <thead class="table-primary">
          <tr>
            <th>Indemnités</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of indemnities; index as i">
            <th>{{ item.name }}</th>
            <td class="text-end">
              <input type="number" class="form-control form-control-sm" placeholder="Valeur...">
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid || onLoad">
    <span class="spinner-border me-1" style="width: 14px; height: 14px;" *ngIf="onLoad"></span>
    Enregistrer et valider
  </button>
  <button mat-stroked-button mat-dialog-close color="warn" cdkFocusInitial>Annuler</button>
</mat-dialog-actions>
