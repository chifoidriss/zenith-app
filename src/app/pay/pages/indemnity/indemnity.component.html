<h2 mat-dialog-title>
  Indemnités
  <button mat-dialog-close class="btn-close"></button>
</h2>
<mat-divider></mat-divider>

<mat-dialog-content class="mat-typography-">
  <app-loader *ngIf="loading"></app-loader>

  <div class="" *ngIf="!loading">
    <form [formGroup]="form">
      <div class="row g-1">
        <div class="col">
          <mdb-form-control>
            <input mdbInput type="text" class="form-control" id="name" formControlName="name" placeholder="Nom">
            <label mdbLabel class="form-label" for="name">Nom</label>
          </mdb-form-control>
        </div>
        <div class="col-auto">
          <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid || onLoad">
            <span class="spinner-border me-1" style="width: 14px; height: 14px;" *ngIf="onLoad"></span>
            {{ index >-1 ?'Modifier':'Ajouter' }}
          </button>
        </div>
      </div>
      <div class="mt-2">
      </div>
    </form>

    <hr>
    <div class="table-responsive mt-3">
      <table class="table fixed-first-column table-sm table-striped border mb-0">
        <thead class="table-primary">
          <tr>
            <th width="5px">#</th>
            <th>Nom</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of data; index as i">
            <th>{{ i+1 }}</th>
            <td>{{ item.name }}</td>
            <td class="text-end">
              <button class="btn btn-sm py-1 px-2 text-nowrap btn-light text-primary" (click)="editItem(i, item)">
                <i class="mdi mdi-pencil" style="font-size: 14px; line-height: 14px;"></i>
              </button>
              <button class="btn btn-sm py-1 px-2 text-nowrap btn-light text-danger ms-2" (click)="removeItem(i, item)">
                <i class="mdi mdi-trash-can-outline" style="font-size: 14px; line-height: 14px;"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</mat-dialog-content>
