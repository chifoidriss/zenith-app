<app-auth-layout name="auth" title="Mot de passe oublié">
  <div class="alert alert-success mb-4" role="alert" *ngIf="message">
    {{ message }}
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mdb-form-control class="mb-3">
      <input mdbInput type="email" class="form-control form-control-lg" id="email" formControlName="email" placeholder="name@example.com">
      <label mdbLabel class="form-label" for="email">Adresse email</label>
    </mdb-form-control>

    <div class="text-center text-lg-start mt-2 pt-2">
      <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="form.invalid">Réinitialiser</button>
      <p class="small fw-bold mt-3 pt-1 mb-0">
        Vous avez déjà un compte ?
        <a routerLink="/auth/login" class="link-danger">Se connecter</a>
      </p>
    </div>
  </form>
</app-auth-layout>
