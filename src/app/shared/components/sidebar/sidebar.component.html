<div class="card sidebar">
  <div class="header">
    <div class="profile">
      <img [src]="auth.user.avatar" class="w-100" alt="">
    </div>
    <h5 class="username">{{ auth.user.name }}</h5>
    <small class="text-muted">{{ auth.user.title }}</small>
  </div>

  <div class="content">
    <h5 class="nav-header">{{ name }}</h5>
    <div class="nav-item" (click)="toggleMenu($event)" *ngFor="let link of links">
      <a class="nav-link" *ngIf="link.links.length == 0" [routerLink]="link.link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <i [class]="link.icon"></i>
        {{ link.name }}
      </a>
      <a class="nav-link has-links" *ngIf="link.links.length > 0">
        <i [class]="link.icon"></i>
        {{ link.name }}
      </a>
      <div class="nav-links" *ngIf="link.links.length > 0">
        <a class="nav-link"
          *ngFor="let subLink of link.links"
          [routerLink]="subLink.link"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: true}">
          {{ subLink.name }}
        </a>
      </div>
    </div>
  </div>
