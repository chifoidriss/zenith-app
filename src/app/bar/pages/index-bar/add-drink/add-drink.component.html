<h2 mat-dialog-title>Creation d'une nouvelle boisson</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <div class="mb-3">
      <label for="name" class="col-form-label">Nom:</label>
      <input type="text" class="form-control" formControlName="name" id="name">
    </div>
    <div class="mb-3">
      <label for="categorie" class="col-form-label">Categorie:</label>
      <input type="text" class="form-control" formControlName="category_id"  id="categorie">
    </div>
    <div class="mb-3">
      <label for="price" class="col-form-label">Prix:</label>
      <input type="number" class="form-control" formControlName="price"  id="price">
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-raised-button [color]="'primary'" [disabled]="form.invalid" [mat-dialog-close]="form.value">Enregistrer</button>
  <button mat-stroked-button [color]="'warn'" mat-dialog-close>Fermer</button>
</mat-dialog-actions>
